# Deployed by Coolify as this repo's docker_compose_location. Unlike docker-compose.yaml,
# this does NOT bundle its own Postgres or Valkey — it connects to this tenant's shared
# `postgresql` and `valkey` instances using a dedicated `n8n` database and a dedicated
# Valkey ACL user respectively (see README's "Database and queue" section). Joins the
# `coolify` external network for Traefik routing and to reach both shared services by
# service name. Only the `n8n` service gets a public domain — `n8n-worker` and
# `task-runners` are internal-only (docker_compose_domains suppressed for both).
services:
  n8n:
    image: n8nio/n8n:2.34.5
    env_file:
      - .env
    environment:
      N8N_EDITOR_BASE_URL: ${APP_URL:?APP_URL must be set}
      WEBHOOK_URL: ${APP_URL:?APP_URL must be set}
      N8N_HOST: ${APP_URL:?APP_URL must be set}
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: valkey
      QUEUE_BULL_REDIS_USERNAME: ${VALKEY_USERNAME:?VALKEY_USERNAME must be set}
      QUEUE_BULL_REDIS_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}
      QUEUE_BULL_PREFIX: n8n
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
    # No `ports:` mapping on purpose — see this repo's CLAUDE.md. Traefik reaches the
    # container over the `coolify` network and auto-selects the image's EXPOSEd port (5678).
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - coolify
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n-worker:
    image: n8nio/n8n:2.34.5
    command: worker
    env_file:
      - .env
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: valkey
      QUEUE_BULL_REDIS_USERNAME: ${VALKEY_USERNAME:?VALKEY_USERNAME must be set}
      QUEUE_BULL_REDIS_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}
      QUEUE_BULL_PREFIX: n8n
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - coolify
    depends_on:
      n8n:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  task-runners:
    image: n8nio/runners:2.35.3-distroless
    user: "65532:65532"
    env_file:
      - .env
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
    networks:
      - coolify
    depends_on:
      - n8n-worker
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No healthcheck: block — found live in Task 7. The distroless image ships no shell and
    # no HTTP client of any kind (confirmed: no /bin/sh, no wget/curl, and the entrypoint
    # binary itself has no built-in self-check subcommand), so a CMD-SHELL+wget healthcheck
    # (or any exec-form healthcheck) cannot run under any circumstances on this image.
    # Liveness is only observable via container run-state (docker ps / docker inspect
    # .State.Status), not Docker's own HEALTHCHECK status — Task 10's health verification must
    # account for this rather than expect "healthy" on this specific service.

volumes:
  n8n-data:

networks:
  coolify:
    external: true
