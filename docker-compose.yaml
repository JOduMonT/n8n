services:
  n8n:
    image: n8nio/n8n:2.34.5
    environment:
      N8N_EDITOR_BASE_URL: ${APP_URL:-http://localhost:5678}
      WEBHOOK_URL: ${APP_URL:-http://localhost:5678}
      N8N_HOST: ${APP_URL:-http://localhost:5678}
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n_user}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: valkey
      QUEUE_BULL_REDIS_PASSWORD: ${VALKEY_PASSWORD:-n8n}
      QUEUE_BULL_PREFIX: n8n
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Security hardening (OWASP Docker Security Cheat Sheet). Deliberately no read_only:
    # true here — n8n's write surface beyond the declared /home/node/.n8n volume isn't fully
    # enumerable ahead of time (depends on what a user configures). Revisit if/when the
    # actual runtime write paths are fully documented upstream, same posture as metamcp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n-worker:
    image: n8nio/n8n:2.34.5
    command: worker
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n_user}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: valkey
      QUEUE_BULL_REDIS_PASSWORD: ${VALKEY_PASSWORD:-n8n}
      QUEUE_BULL_PREFIX: n8n
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Security hardening (OWASP Docker Security Cheat Sheet). Deliberately no read_only:
    # true here — n8n's write surface beyond the declared /home/node/.n8n volume isn't fully
    # enumerable ahead of time (depends on what a user configures). Revisit if/when the
    # actual runtime write paths are fully documented upstream, same posture as metamcp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  task-runners:
    image: n8nio/runners:2.35.3-distroless
    user: "65532:65532"
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
    depends_on:
      - n8n-worker
    restart: "no"
    # Hardened per https://docs.n8n.io/deploy/host-n8n/configure-n8n/security/harden-task-runners:
    # distroless image (no shell/package manager), unprivileged nobody user (65532:65532),
    # read-only root fs with a small tmpfs /tmp, cap_drop: ALL. AppArmor profile from the same
    # guide is deliberately NOT applied here — it requires a profile loaded on the Coolify
    # host, and this fleet has no host-provisioning mechanism yet. Tracked as a known gap in
    # specs/n8n.md, follow-up work.
    #
    # No Docker healthcheck: verified live that n8nio/runners:2.34.5-distroless ships neither
    # a shell (no /bin/sh, so CMD-SHELL always fails with "exec: /bin/sh: no such file or
    # directory") nor wget/curl (no exec-form HTTP check is possible either) — confirmed via
    # `docker exec` against the running container, and matches the distroless image's own
    # stated design ("excluding package managers, shells, and other utilities that aren't
    # needed at runtime" per the hardening guide linked above). Adding an HTTP client back in
    # would defeat the point of choosing the distroless image. The launcher process does open
    # a health-check HTTP server on :5680 (visible in its own startup logs), so an external
    # prober (e.g. from another container, or Coolify's own health mechanism if it becomes
    # available for non-web services) could still hit it — tracked as a known gap in
    # specs/n8n.md alongside the AppArmor gap. Container `running` state (not health status)
    # is what Step 3's validation checks, consistent with this file's own note there.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_user} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-n8n}", "--appendonly", "yes"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-n8n}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # user: "999:1000" (valkey:valkey, baked into the image) — the image's entrypoint drops
    # from root to this user via `setpriv`, which needs SETUID/SETGID; cap_drop: ALL removes
    # those, so the container must start as this user directly instead. /data is already
    # valkey-owned and world-writable (1777) in the image, so this works against a fresh
    # named volume with no extra chown step. (Found live in the valkey repo's Task 1: the
    # block without this line restart-loops with "setpriv: setresuid failed".)
    user: "999:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n-data:
  postgres-data:
  valkey-data:
